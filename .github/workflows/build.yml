name: Build EndoGram IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize IPA builds without killing a build that has already started.
# A newer pending commit may replace an older pending run, but active builds continue.
concurrency:
  group: endogram-ipa-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Compile for iPhone
        run: |
          xcodebuild \
            -project EndoGram.xcodeproj \
            -scheme EndoGram \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/EndoGram.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/zip -qry EndoGram.ipa Payload
          test -s EndoGram.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EndoGram-unsigned-IPA
          path: build/EndoGram.ipa
          if-no-files-found: error
          retention-days: 14
