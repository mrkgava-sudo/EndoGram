name: EndoGram
options:
  bundleIdPrefix: app.endogram
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  EndoGram:
    type: application
    platform: iOS
    sources:
      - path: EndoGram
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.endogram.ios
        PRODUCT_NAME: EndoGram
        INFOPLIST_KEY_CFBundleDisplayName: EndoGram
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
